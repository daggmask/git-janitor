[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-janitor"
version = "0.1.0"
description = "Find old git worktrees and clones and clean them up safely"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Hellström" }]
keywords = ["git", "worktree", "cleanup", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.scripts]
git-janitor = "git_janitor.cli:app"

[project.urls]
Source = "https://github.com/daggmask/git-janitor"

[tool.hatch.build.targets.wheel]
packages = ["src/git_janitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
